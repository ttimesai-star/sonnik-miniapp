name: CI and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --redact --verbose --exit-code 1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: engine parity (AC1, AC3) + storage + static checks (AC4, AC8, AC9)
        run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: e2e in Chromium, mobile viewport (AC4-AC9)
        run: |
          python -m pip install --quiet playwright==1.58.0
          python -m playwright install --with-deps chromium
          python tests/e2e_playwright.py --shots shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: shots/

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [gitleaks, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: site = only the files the page needs
        run: |
          mkdir -p _site/dictionary
          cp index.html styles.css app.js engine.js storage.js LICENSE _site/
          cp dictionary/symbols.json dictionary/symbols_en.json _site/dictionary/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
